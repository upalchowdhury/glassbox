<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glassbox — a tiny model you can see all the way through</title>
<style>
:root{
  --ink:#17221f; --muted:#56635f; --faint:#78847f; --bg:#f6f7f3; --card:#fff;
  --line:#dde3dc; --accent:#176b58; --accent-ink:#0e4d40; --soft:#e8f4ee;
  --nav:#17342d; --nav-soft:#22463d; --warn:#8a4a0c; --warn-bg:#fff4e4; --bad:#9a2c2c; --bad-bg:#fdeceb;
  --good:#166b46; --focus:#8a4500;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button,select{cursor:pointer}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink);font-weight:600}
button:hover{border-color:var(--accent);background:#f2f8f5}
/* 3px solid dark-amber reaches 4.6:1 on white; the old #f0aa53 measured 1.98:1. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:var(--accent-ink)}
button.active{background:var(--soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent-ink)}
h1,h2,h3,p{margin:0 0 13px}
h1{font-size:38px;line-height:1.12;letter-spacing:-1.1px;max-width:800px}
h2{font-size:21px;line-height:1.3;letter-spacing:-.4px}
h3{font-size:15px}
p:last-child{margin-bottom:0}
code,pre,.mono{font-family:var(--mono)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f9;border:1px solid var(--line);padding:15px;border-radius:10px;font-size:13px;overflow-x:auto}
.small{font-size:12.5px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.badge{display:inline-flex;gap:5px;align-items:center;border-radius:20px;background:var(--soft);color:var(--accent-ink);padding:4px 9px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.badge.amber{background:var(--warn-bg);color:var(--warn)}
.badge.gray{background:#e9edf1;color:#4a5662}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.good{background:#e2f3e9;color:var(--good)}
.tagline{font-size:17px;max-width:760px;color:var(--muted);line-height:1.6}
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:#fff;padding:28px 18px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:24px;font-weight:800;letter-spacing:-.8px;padding-left:10px}
.brand-mark{display:inline-block;width:18px;height:18px;border:2px solid #76dac2;transform:rotate(-12deg);margin-right:9px;vertical-align:middle}
.sidebar .sub{font-size:10.5px;color:#b9d2c9;padding:5px 10px 24px;letter-spacing:.7px}
.nav-label{font-size:10px;font-weight:800;letter-spacing:1.3px;color:#a9c4bb;padding:14px 10px 7px;text-transform:uppercase}
.nav-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:transparent;color:#dbe9e4;border:1px solid transparent;padding:10px;margin-bottom:3px;font-size:13px;border-radius:9px;font-weight:500}
.nav-item span.n{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#ffffff12;font:10px var(--mono);color:#bdd3cb;flex:none}
.nav-item:hover{background:var(--nav-soft);color:#fff;border-color:transparent}
.nav-item[aria-current="page"]{color:#fff;background:#2b574b;border-color:#568174;font-weight:700}
.nav-item[aria-current="page"] span.n{background:#dff3e9;color:#174e41}
.nav-toggle{width:100%;margin-top:10px;background:#ffffff0a;border-color:#ffffff24;color:#dbe9e4;text-align:left;font-size:12px}
.nav-toggle:hover{background:#ffffff14;border-color:#ffffff40}
.side-note{border-top:1px solid #ffffff1f;margin:20px 10px 0;padding-top:16px;color:#b7cec6;font-size:11px}
.workspace{min-width:0}
.topbar{background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 32px;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.topbar-copy{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-copy span{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint)}
.topbar-copy strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.topbar label{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%;color:var(--ink)}
main{max-width:1320px;padding:38px 38px 64px;margin:auto}
.page-head{margin-bottom:28px}
.page-head .badge{margin-bottom:12px}
.grid{display:grid;gap:18px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.halves{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0;box-shadow:0 1px 2px #17221f08}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.divider{border:0;border-top:1px solid var(--line);margin:18px 0}
.callout{border-left:3px solid var(--accent);background:#eef7f3;padding:14px 17px;border-radius:0 10px 10px 0;font-size:13px;margin-top:16px}
.callout.amber{background:var(--warn-bg);border-color:#c07a20}
.callout.bad{background:var(--bad-bg);border-color:var(--bad)}
.stat{font-size:26px;letter-spacing:-.6px;font-weight:750}
.stat-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:18px 0}
.toolbar,.step-controls,.token-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.toolbar{justify-content:space-between;margin:14px 0}
.token{font-family:var(--mono);padding:6px 8px;min-width:34px}
.token small{display:block;opacity:.7;font-size:9.5px}
.matrix-wrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fafcfd;padding:9px}
.matrix{border-collapse:separate;border-spacing:3px;font-family:var(--mono);font-size:10.5px;margin:auto}
.matrix th{font-weight:600;min-width:23px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.matrix td{padding:0}
.cell{display:block;min-width:46px;min-height:32px;font:10.5px var(--mono);padding:5px 3px;border-radius:4px;border:1px solid transparent;color:#16232e}
.cell:hover{box-shadow:0 0 0 2px #8a4500;border-color:#8a4500}
.cell[aria-pressed="true"]{outline:2px solid #8a4500;outline-offset:0;font-weight:700}
.cell.masked{color:#5a6673;font-style:italic}
.matrix tr.focus th{color:var(--accent-ink);font-weight:800}
.legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:9px;flex-wrap:wrap}
.swatch{width:12px;height:12px;display:inline-block;border-radius:3px;border:1px solid #0002}
.inspector{background:#f5f8fa;padding:14px;border-radius:10px;font-size:12.5px;min-height:72px;margin-top:14px;overflow-wrap:anywhere}
.inspector .value{font:22px var(--mono);margin:6px 0}
.bars{margin:11px 0}
.bar-row{display:grid;grid-template-columns:44px 1fr 52px;gap:9px;align-items:center;margin:8px 0;font:12px var(--mono)}
.bar-bg{height:15px;background:#e7ecf0;border-radius:4px;overflow:hidden}
.bar{height:100%;background:#3f8a7c;min-width:1px}
.bar-row.target .bar{background:#0a5f56}
.bar-row.target{font-weight:800;color:var(--accent-ink)}
.vector{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.vector span{font:12px var(--mono);padding:6px 9px;border-radius:5px;background:#eff4f7;border:1px solid #dbe4ea}
.slider-row{display:grid;grid-template-columns:52px 1fr 44px;gap:10px;align-items:center;margin:13px 0;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.5 var(--mono);min-height:74px;color:var(--ink);background:#fafcfd}
input[type=text],input[type=number]{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-family:var(--mono);max-width:100%}
.mask-tokens{display:flex;gap:3px;flex-wrap:wrap}
.mask-token{padding:4px 6px;font:11px var(--mono);border:1px solid var(--line);border-radius:3px;background:#eef1f4;color:#56626e}
.mask-token.on{background:#d2efe2;border-color:#7dbfa2;color:#10452f;font-weight:600}
.mask-token small{font-size:8.5px;display:block;opacity:.8}
.route{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fafcfd}
.route h3{margin:6px 0}
.route p{font-size:12px;color:var(--muted)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
table.data th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
table.data td.num,table.data th.num{text-align:right;font-family:var(--mono)}
table.data tr:last-child td{border-bottom:0}
table.data .best{font-weight:800;color:var(--accent-ink)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-mark{font:11px var(--mono);font-weight:800;padding:2px 7px;border-radius:5px;flex:none}
.check-mark.pass{background:#e2f3e9;color:var(--good)}
.check-mark.fail{background:var(--bad-bg);color:var(--bad)}
details{margin-top:12px}
summary{cursor:pointer;font-size:12.5px;color:var(--accent-ink)}
footer{padding:22px 30px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.stack-scene{height:330px;position:relative;overflow:hidden;perspective:1000px;background:#f3f7fa;border:1px solid var(--line);border-radius:10px}
.plane{position:absolute;left:50%;top:42%;padding:9px;background:#fffffff2;border:1px solid #8ba8b7;border-radius:9px}
.mini-matrix{border-collapse:separate;border-spacing:2px;font:9px var(--mono)}
.mini-matrix td{width:26px;height:19px;text-align:center;border-radius:3px}
.plane-label{font-size:10px;margin-bottom:4px;font-weight:700}
.curve{width:100%;height:auto;display:block}
canvas{max-width:100%;height:auto}
.flow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:16px 0}
.flow-box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;text-align:center;min-width:78px}
.flow-box strong{display:block;font:14px var(--mono)}
.flow-box small{display:block;margin-top:3px;color:var(--muted)}
.flow-arrow{color:#7b8c9a;font-size:20px}
.lineage{font:12px/1.9 var(--mono);white-space:pre-wrap}
.banner{background:#fdeceb;border-bottom:1px solid #e6b5b2;color:#7a2320;padding:11px 30px;font-size:13px}
.hero{background:linear-gradient(135deg,#f5fbf7 0%,#fff 58%,#fff9ee 100%);border-color:#cfe0d8;padding:34px}
.hero-kicker{font-size:13px;font-weight:800;color:var(--accent-ink);margin-bottom:10px}
.hero h2{font-size:30px;line-height:1.2;letter-spacing:-.7px;max-width:680px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.idea-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.idea{padding:19px;border:1px solid var(--line);border-radius:14px;background:#fff}
.idea-number{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent-ink);font-weight:800;margin-bottom:13px}
.idea p{font-size:13px;color:var(--muted)}
.plain-list{list-style:none;padding:0;margin:16px 0 0}
.plain-list li{position:relative;padding:9px 0 9px 29px;border-bottom:1px solid var(--line)}
.plain-list li:last-child{border-bottom:0}
.plain-list li::before{content:'✓';position:absolute;left:0;color:var(--good);font-weight:800}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.lesson-nav button{max-width:48%;text-align:left}
.lesson-nav .next{text-align:right;margin-left:auto}
.lesson-progress{height:3px;background:#e6ebe7;position:sticky;top:61px;z-index:9}
.lesson-progress span{display:block;height:100%;background:var(--accent);transition:width .2s ease}
.simple-note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px;max-width:820px}
.simple-note strong{display:block;color:var(--accent-ink);margin-bottom:4px}
.simple-note p{font-size:13px;color:var(--muted);margin:0}
.course-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.course-tools select{font-size:12px;padding:6px 8px}
.course-chip{font-size:11px;border-radius:999px;padding:5px 9px;background:#eef3ef;color:var(--accent-ink);font-weight:800;letter-spacing:.3px}
.lab-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin:16px 0}
.lab-step{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fbfcfa;min-width:0}
.lab-step strong{display:block;font-size:13px;margin-bottom:3px}.lab-step small{display:block;color:var(--muted);line-height:1.4}
.lab-step.active{border-color:var(--accent);background:var(--soft)}
.lab-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0;padding:15px;border-radius:12px;background:#f6f8f6;border:1px solid var(--line)}
.lab-controls label{font-size:12px;font-weight:700;color:var(--muted)}.lab-controls select,.lab-controls input{display:block;width:100%;margin-top:5px}
.depth-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.depth-tabs button{font-size:12px;padding:7px 10px}
.depth-panel{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fbfcfa;margin-top:14px}.depth-panel h3{margin-bottom:6px}
.what-changed{border:1px solid #bad6c8;border-radius:12px;background:#f0f8f3;padding:15px;margin-top:16px}.what-changed h3{color:var(--accent-ink)}
.trace-row{display:grid;grid-template-columns:1.25fr repeat(4,minmax(70px,.55fr));gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.trace-row:last-child{border-bottom:0}.trace-row code{overflow-wrap:anywhere}
.route-bars{display:grid;gap:9px;margin:14px 0}.route-bar{display:grid;grid-template-columns:85px 1fr 55px;gap:8px;align-items:center;font-size:12px}.route-bar i{height:12px;display:block;border-radius:8px;background:var(--accent)}
.status-list{display:grid;gap:8px;margin:14px 0}.status-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}.status-item .state{font-weight:800;min-width:20px;color:var(--bad)}.status-item.ok .state{color:var(--good)}
.timeline{border-left:2px solid var(--line);margin:16px 0 0 8px;padding-left:18px}.timeline-item{position:relative;padding:0 0 17px}.timeline-item::before{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--accent);border-radius:50%;background:#fff;left:-25px;top:5px}.timeline-item h3{margin-bottom:3px}.timeline-item p{font-size:13px;color:var(--muted);margin:0}
.checkpoint-journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}.checkpoint-node{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.checkpoint-node strong{display:block}.checkpoint-node small{display:block;color:var(--muted);margin-top:4px}
.gated{opacity:.62;filter:saturate(.7)}
@media(max-width:1100px){.two,.halves,.three,.idea-grid{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:224px 1fr}main{padding:28px}.topbar{padding:12px 24px}}
@media(max-width:760px){html,body{max-width:100%;overflow-x:hidden}.shell{display:block}.sidebar{position:static;height:auto;width:100%;overflow:hidden;padding:16px}.sidebar .sub,.side-note{display:none}#nav{display:flex;width:100%;max-width:100%;overflow-x:auto;margin-top:12px;gap:5px}.nav-label{display:none}.nav-item{min-width:160px;font-size:11.5px;margin:0}.nav-toggle{min-width:160px;margin:0}.topbar{position:static;display:grid;grid-template-columns:minmax(0,1fr);padding:11px 16px;gap:8px}.topbar-tools{width:100%;justify-content:flex-start}.topbar-tools #provenance{display:none}.topbar label{display:grid;grid-template-columns:auto minmax(0,1fr);width:100%}.topbar select{width:100%;min-width:0}.lesson-progress{position:static}.topbar-copy span{display:none}main{width:100%;max-width:100%;padding:25px 16px 42px}h1{font-size:30px;overflow-wrap:anywhere}.hero{padding:24px}.hero h2{font-size:25px;overflow-wrap:anywhere}.hero .flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.hero .flow-box{min-width:0}.hero .flow-arrow{display:none}.hero-actions button{width:100%}.card{width:100%;max-width:100%;padding:18px}.stat{font-size:21px}.cell{min-width:42px}footer{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<button class="skip-link" data-act="focusMain">Skip to reading</button>
<noscript><p>Glassbox needs JavaScript to display its local reading chapters. Enable it and reload; no account, network connection, or coding is required.</p></noscript>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark"></span>glassbox</div>
  <div class="sub">READ. CONNECT. UNDERSTAND.</div>
  <nav id="nav" aria-label="Lessons"></nav>
  <div class="side-note" id="side-note"></div>
</aside>
<div class="workspace">
  <header class="topbar">
    <div class="topbar-copy"><span>Current lesson</span><strong id="current-title">Overview</strong></div>
    <div class="topbar-tools">
      <span class="small muted" id="provenance">loading…</span>
      <div class="course-tools" aria-label="Course controls">
        <label>Depth <select id="depth" aria-label="Reading depth"><option value="see">Summary</option><option value="explain" selected>Read</option><option value="derive">Deep dive</option></select></label>
        <button id="bookmark-course" type="button" title="Save your place in this chapter">Bookmark</button>
        <button id="resume-course" type="button">Resume</button>
      </div>
      <label class="reference-control">Recorded checkpoint
        <select id="checkpoint" aria-label="Model version (checkpoint)"></select>
      </label>
    </div>
  </header>
  <div class="lesson-progress" aria-hidden="true"><span id="lesson-progress"></span></div>
  <div id="boot-error" class="banner" hidden role="alert"></div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <main id="main" tabindex="-1"></main>
  <footer id="footer"></footer>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Boot. A teaching tool must fail visibly: if the run artifact is
 * missing or malformed, say so instead of rendering a blank page.
 * ------------------------------------------------------------------ */
let DATA = null;
let BOOT_ERROR = null;
try {
  const raw = document.getElementById('run-data').textContent;
  DATA = JSON.parse(raw);
  if (!DATA || !DATA.manifest || !DATA.checkpoints || !DATA.checkpoint_order) {
    BOOT_ERROR = 'The run data block is present but has no manifest or checkpoints. ' +
      'Build one with:  python -m glassbox.export';
    DATA = null;
  }
} catch (err) {
  BOOT_ERROR = 'Could not parse the embedded run data (' + err.message + '). ' +
    'Rebuild it with:  python -m glassbox.export';
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

if (BOOT_ERROR) {
  const box = $('boot-error');
  box.hidden = false;
  box.textContent = 'Recorded references are unavailable. The reading chapters still work. ' + BOOT_ERROR;
  $('provenance').textContent = 'no run loaded';
}

/* ------------------------------------------------------------------ *
 * Formatting helpers
 * ------------------------------------------------------------------ */

const MASKED = '−∞';

/* null in a tensor means -inf, which is how the causal mask is stored.
 * It is a real value with a meaning, not missing data, so it is rendered
 * distinctly rather than as an empty cell or a zero. */
const isMasked = v => v === null || v === undefined;
const fmt = (v, d = 4) => isMasked(v) ? MASKED : Number(v).toFixed(d);
const pct = v => (Number(v) * 100).toFixed(1) + '%';
const tokLabel = i => (DATA.data.vocab_display[i] !== undefined
  ? DATA.data.vocab_display[i] : '?');

function announce(msg) { $('live').textContent = msg; }

/* ------------------------------------------------------------------ *
 * State. Every index is clamped against the CURRENT tensor before use,
 * because the checkpoint selector, the operation selector and a
 * freshly built run can each change the shapes underneath a stale index.
 * ------------------------------------------------------------------ */

const PAGES = [
  ['start', 'Course home', 'course'],
  ...((window.GlassboxCourseContent && window.GlassboxCourseContent.modules) ||
    ((window.GlassboxBook && window.GlassboxBook.chapters) || []).map(c => [c.id, c.title])).map(([id, title]) => [id, title, 'course']),
  ['book', 'Complete book', 'reading'],
  ['glossary', 'Glossary', 'reading'],
  ['tokenize', 'Tokenization reference', 'reference'],
  ['forward', 'Tensor inspector', 'reference'],
  ['update', 'Gradient update', 'reference'],
  ['mlp', 'MLP internals', 'reference'],
  ['pretrain', 'Pretraining trace', 'reference'],
  ['generate', 'Generation trace', 'reference'],
  ['sft', 'Instruction trace', 'reference'],
  ['lora', 'LoRA trace', 'reference'],
  ['preference', 'Preference trace', 'reference'],
  ['rlvr', 'Verifier trace', 'reference'],
  ['evaluate', 'Evaluation trace', 'reference'],
  ['checks', 'Numerical checks', 'reference'],
  ['map', 'Original course map', 'reference'],
];

const BASIC_PAGES = PAGES.filter(p => p[2] === 'course');

const state = {
  page: 'start',
  checkpoint: 'sft',
  op: 0,
  head: 0,
  row: 1,
  col: 0,
  view2d: true,
  weightView: 'gradient',
  wRow: null, wCol: null,
  mlp: [2, 1, 3],
  activation: 'gelu',
  verifier: 'strict',
  responses: ['answer: 6', '2 + 3 = 5.\nanswer: 5', '2 + 3 = 8.\nanswer: 5', 'answer: 25'],
  evalFamily: 'train',
  genSample: 0,
  tilt: 46,
  advancedOpen: false,
  depth: 'explain',
  completed: [],
  bookmark: null,
};

// v1 marked visits as completed. Do not migrate those into explicit reading progress.
const COURSE_STORAGE_KEY = 'glassbox.reading.v2';
function persistCourse() {
  try {
    localStorage.setItem(COURSE_STORAGE_KEY, JSON.stringify({ depth: state.depth, completed: state.completed, bookmark: state.bookmark }));
    return true;
  } catch (_) { return false; }
}
function restoreCourse() {
  try {
    const saved = JSON.parse(localStorage.getItem(COURSE_STORAGE_KEY) || '{}');
    if (!saved || typeof saved !== 'object') return;
    if (['see', 'explain', 'derive'].includes(saved.depth)) state.depth = saved.depth;
    if (Array.isArray(saved.completed)) state.completed = [...new Set(saved.completed.filter(id => BASIC_PAGES.some(p => p[0] === id && id !== 'start')))];
    if (typeof saved.bookmark === 'string' && /^(tinygpt|moe|posttrain|environment|grpo|agents|scaling|dashboard|book)(\/[a-z0-9-]+)?$/.test(saved.bookmark)) state.bookmark = saved.bookmark;
  } catch (_) { /* Reading and navigation also work without storage. */ }
}

const ckpt = () => DATA.checkpoints[state.checkpoint];
const manifest = () => DATA.manifest;

/* The operation list comes from the artifact itself, so a new engine
 * operation appears here without editing the interface. */
function operations() {
  const c = ckpt();
  return c.operations.filter(id => c.tensors[id]);
}

function currentTensor() {
  const ops = operations();
  state.op = Math.max(0, Math.min(state.op, ops.length - 1));
  const id = ops[state.op];
  const rec = ckpt().tensors[id];
  const is4d = rec.shape.length === 4;
  state.head = is4d ? Math.min(state.head, rec.shape[1] - 1) : 0;
  const grid = is4d ? rec.values[0][state.head] : rec.values[0];
  state.row = Math.max(0, Math.min(state.row, grid.length - 1));
  state.col = Math.max(0, Math.min(state.col, grid[0].length - 1));
  return { id, rec, grid, is4d };
}

/* ------------------------------------------------------------------ *
 * Render, preserving keyboard focus.
 *
 * render() replaces the whole main subtree. Without this, every
 * interaction dropped focus to <body>, which makes the page unusable
 * with a keyboard and silently breaks arrow-key navigation of a matrix.
 * ------------------------------------------------------------------ */

function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.dataset && el.dataset.focus) return el.dataset.focus;
  return el.id || null;
}

function render(message) {
  const key = focusKey(document.activeElement);
  const page = PAGES.find(p => p[0] === state.page) || PAGES[0];
  const visible = PAGES.filter(p => p[2] !== 'reference' || state.advancedOpen || p[0] === state.page);
  let lastGroup = '';
  $('nav').innerHTML = visible.map(([id, title, group]) => {
    const groupLabel = group !== lastGroup
      ? `<div class="nav-label">${group === 'course' ? 'Reading journey' : group === 'reading' ? 'Reading tools' : 'Recorded trace reference'}</div>` : '';
    lastGroup = group;
    const number = group === 'course' ? (id === 'start' ? '⌂' : BASIC_PAGES.findIndex(p => p[0] === id))
      : group === 'reading' ? '↗' : PAGES.filter(p => p[2] === 'reference').findIndex(p => p[0] === id) + 1;
    return groupLabel + `<button class="nav-item" ${state.page === id ? 'aria-current="page"' : ''}
      data-goto="${id}"><span class="n">${number}</span>${esc(title)}</button>`;
  }).join('') + `<button class="nav-toggle" data-act="toggleAdvanced" aria-expanded="${state.advancedOpen}">
    ${state.advancedOpen ? '− Hide reference lessons' : '+ Show detailed recorded traces'}</button>`;

  const isReference = page[2] === 'reference';
  const reader = window.GlassboxReader;
  const content = isReference
    ? (DATA ? (VIEWS[state.page] || VIEWS.start)() + probeBlock(state.page) : '<h1>Recorded trace unavailable</h1><p>The embedded run data could not load. You can still read all chapters from the navigation.</p>')
    : (reader ? reader.render(state.page, state) : '<h1>Reading assets could not load</h1><p>Keep reading.js, reading-chapters.js, course-content.js, course-engine.js, and reading.css beside index.html, then reload.</p>');
  $('main').innerHTML = content + (page[2] === 'reading' ? '' : lessonNav());
  document.querySelector('.reference-control').hidden = !isReference || !DATA;
  document.querySelector('.course-tools').hidden = isReference;
  $('depth').disabled = state.page === 'book' || state.page === 'glossary';
  $('bookmark-course').disabled = !BASIC_PAGES.some(p => p[0] === state.page && p[0] !== 'start') && state.page !== 'book';
  $('resume-course').disabled = !state.bookmark;
  $('bookmark-course').textContent = 'Bookmark';
  $('depth').value = state.depth;
  $('current-title').textContent = page[1];
  document.title = `${page[1]} · Glassbox`;
  $('lesson-progress').style.width = `${state.completed.length / Math.max(1, BASIC_PAGES.length - 1) * 100}%`;
  $('provenance').textContent = isReference ? 'Recorded model trace' : 'Reading edition';

  if (key) {
    const again = document.querySelector(`[data-focus="${CSS.escape(key)}"]`) || $(key);
    if (again) again.focus({ preventScroll: true });
  }
  if (DATA && AFTER[state.page]) AFTER[state.page]();
  if (message) announce(message);
}

function goto(route, fromHash = false) {
  const [page, anchor] = String(route).split('/');
  if (!PAGES.some(p => p[0] === page)) return;
  if (!fromHash && location.hash.slice(1) !== route) { location.hash = route; return; }
  if (PAGES.find(p => p[0] === page)[2] === 'reference') state.advancedOpen = true;
  state.page = page;
  render();
  $('main').focus({ preventScroll: true });
  const target = anchor && /^[a-z0-9-]+$/.test(anchor) ? $(anchor) : null;
  if (target && $('main').contains(target)) target.scrollIntoView({behavior:'instant', block:'start'});
  else window.scrollTo({ top: 0, behavior: 'instant' });
  $('main').dataset.route = route;
}

function lessonNav() {
  const current = PAGES.find(p => p[0] === state.page) || PAGES[0];
  const sequence = current[2] === 'course' ? BASIC_PAGES : PAGES.filter(p => p[2] === 'reference');
  const index = sequence.findIndex(p => p[0] === state.page);
  const previous = index > 0 ? sequence[index - 1] : null;
  const next = index < sequence.length - 1 ? sequence[index + 1] : null;
  return `<nav class="lesson-nav" aria-label="Lesson navigation">
    ${previous ? `<button data-goto="${previous[0]}">← ${esc(previous[1])}</button>` : '<span></span>'}
    ${next ? `<button class="next primary" data-goto="${next[0]}">${esc(next[1])} →</button>` : '<button class="next" data-goto="start">Back to overview ↑</button>'}
  </nav>`;
}

/* One delegated listener. Inline onclick handlers in generated HTML are
 * easy to get wrong and impossible to audit; this keeps every action in
 * one place. */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button[data-goto],button[data-act]');
  if (!t) return;
  if (t.dataset.goto) { goto(t.dataset.goto); return; }
  const act = t.dataset.act;
  const arg = t.dataset.arg;
  if (ACTIONS[act]) { ev.preventDefault(); ACTIONS[act](arg, t); }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.act) return;
  if (ACTIONS[t.dataset.act]) ACTIONS[t.dataset.act](t.value, t);
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.live && ACTIONS[t.dataset.live]) {
    ACTIONS[t.dataset.live](t.value, t);
  }
});

 * Shared components

const head = (tag, title, lead, kind = '') =>
  `<div class="page-head"><span class="badge ${kind}">${esc(tag)}</span>
   <h1>${esc(title)}</h1><p class="tagline">${lead}</p></div>`;

function color(v, max) {
  if (isMasked(v)) return '#e3e8ec';
  const a = Math.min(Math.abs(v) / (max || 1), 1);
  return v >= 0 ? `rgba(18,120,92,${0.08 + 0.42 * a})`
                : `rgba(74,92,170,${0.08 + 0.38 * a})`;
}

/* A matrix of numbers. The accessible label uses the SAME rounded text
 * the cell displays, so a screen reader and a sighted reader are told
 * the same number; the exact value is in the inspector below. */
function matrix(grid, opts = {}) {
  const { mode = 'tensor', rowLabels = null, colLabels = null,
          selRow = state.row, selCol = state.col, act = 'pickCell', decimals = 2 } = opts;
  const flat = grid.flat().filter(v => !isMasked(v)).map(Math.abs);
  const max = Math.max(...flat, 1e-9);
  const body = grid.map((row, i) => {
    const label = rowLabels ? rowLabels[i] : String(i);
    return `<tr class="${i === selRow ? 'focus' : ''}">
      <th scope="row">${esc(label)}</th>
      ${row.map((v, j) => {
        const shown = isMasked(v) ? MASKED : fmt(v, decimals);
        const sel = i === selRow && j === selCol;
        return `<td><button class="cell ${isMasked(v) ? 'masked' : ''}"
          aria-pressed="${sel}"
          data-focus="${mode}-${i}-${j}"
          data-act="${act}" data-arg="${i},${j}"
          style="background:${color(v, max)}"
          aria-label="row ${esc(label)}, column ${colLabels ? esc(colLabels[j]) : j}, ${isMasked(v) ? 'masked, negative infinity' : shown}"
          >${shown}</button></td>`;
      }).join('')}</tr>`;
  }).join('');
  return `<div class="matrix-wrap"><table class="matrix">
    <caption class="sr-only">${mode === 'tensor' ? 'Activation slice' : 'Weight matrix'}. Rows and columns are indexed from zero. Activate a cell to inspect it.</caption>
    <thead><tr><th scope="col">r\\c</th>
    ${grid[0].map((_, j) => `<th scope="col">${colLabels ? esc(colLabels[j]) : j}</th>`).join('')}
    </tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span class="swatch" style="background:rgba(74,92,170,.5)"></span>negative
    <span class="swatch" style="background:rgba(18,120,92,.5)"></span>positive
    <span class="swatch" style="background:#e3e8ec"></span>masked (−∞)
    · shade shows magnitude · displayed to ${decimals} decimals</div>`;
}

/* A line chart. Series measured on different distributions get their own
 * axis and are drawn with a distinct dash pattern, because plotting them
 * against one shared axis invites exactly the comparison the course says
 * is invalid. */
function chart(items, series, opts = {}) {
  const { xKey = 'step', xLabel = 'optimizer steps', height = 225,
          refs = [], sharedAxis = true } = opts;
  const pts = items.filter(d => series.some(s => Number.isFinite(d[s.key])));
  if (pts.length === 0) return '<p class="small muted">No points recorded for this series.</p>';
  const W = 640, H = height, L = 52, R = 16, T = 14, B = 38;
  const xs = pts.map(d => d[xKey]);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const allVals = series.flatMap(s => pts.map(d => d[s.key])).concat(refs.map(r => r.value))
    .filter(Number.isFinite);
  const yMax = Math.max(...allVals) * 1.1 || 1;
  const yMin = Math.min(0, ...allVals);
  /* A single recorded point would otherwise divide by zero and draw nothing. */
  const px = v => xMax === xMin ? L + (W - L - R) / 2
    : L + (v - xMin) / (xMax - xMin) * (W - L - R);
  const py = v => H - B - (v - yMin) / (yMax - yMin) * (H - B - T);
  const colors = ['#0a5f56', '#5b4bb0', '#a6541c', '#2a6f97'];
  const dashes = ['', '6 4', '2 3', '9 3'];

  const gridLines = [0, .25, .5, .75, 1].map(f => {
    const v = yMin + (yMax - yMin) * f;
    return `<line x1="${L}" x2="${W - R}" y1="${py(v)}" y2="${py(v)}" stroke="#e3e8ec"/>
      <text x="${L - 7}" y="${py(v) + 4}" text-anchor="end" font-size="10" fill="#5c6c7a">${v.toFixed(2)}</text>`;
  }).join('');

  const refLines = refs.map((r, i) => `
    <line x1="${L}" x2="${W - R}" y1="${py(r.value)}" y2="${py(r.value)}"
      stroke="${r.color || '#93a3b0'}" stroke-dasharray="3 3"/>
    <text x="${W - R - 3}" y="${py(r.value) - 5}" text-anchor="end" font-size="9.5"
      fill="${r.color || '#5c6c7a'}">${esc(r.label)} ${r.value.toFixed(3)}</text>`).join('');

  const paths = series.map((s, j) => {
    const d = pts.filter(p => Number.isFinite(p[s.key]))
      .map((p, i) => `${i ? 'L' : 'M'}${px(p[xKey]).toFixed(1)},${py(p[s.key]).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${colors[j % 4]}" stroke-width="2.4"
      stroke-dasharray="${dashes[j % 4]}"/>`;
  }).join('');

  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${esc(series.map(s => s.label).join(' and '))} over ${esc(xLabel)}">
    ${gridLines}${refLines}${paths}
    <text x="${L}" y="${H - 12}" font-size="10" fill="#5c6c7a">${xMin}</text>
    <text x="${W - R}" y="${H - 12}" text-anchor="end" font-size="10" fill="#5c6c7a">${xMax} ${esc(xLabel)}</text>
  </svg>
  <div class="legend">${series.map((s, j) =>
    `<span class="swatch" style="background:${colors[j % 4]}"></span>${esc(s.label)}`).join(' ')}</div>
  ${sharedAxis ? '' : '<p class="small muted">These series measure different distributions. Compare each curve with its own earlier values, not with the other curve.</p>'}`;
}

function statRow(items) {
  return `<div class="stat-row">${items.map(([v, l, title]) =>
    `<div${title ? ` title="${esc(title)}"` : ''}><div class="stat">${esc(String(v))}</div>
     <div class="stat-label">${esc(l)}</div></div>`).join('')}</div>`;
}

function probBars(probs, targetId, limit = 8) {
  const ranked = probs.map((p, i) => ({ p, i })).sort((a, b) => b.p - a.p);
  const top = ranked[0].p || 1;
  return `<div class="bars">${ranked.slice(0, limit).map(({ p, i }) =>
    `<div class="bar-row ${i === targetId ? 'target' : ''}">
      <span>${esc(tokLabel(i))}</span>
      <div class="bar-bg"><div class="bar" style="width:${(p / top * 100).toFixed(1)}%"></div></div>
      <span>${(p * 100).toFixed(1)}%</span></div>`).join('')}</div>`;
}

function table(headers, rows, opts = {}) {
  return `<div class="scroll-x"><table class="data"><thead><tr>${
    headers.map((h, i) => `<th${i ? ' class="num"' : ''} scope="col">${esc(h)}</th>`).join('')
  }</tr></thead><tbody>${rows.map(r => `<tr>${
    r.map((c, i) => `<td${i ? ' class="num"' : ''}${c && c.best ? ' class="num best"' : ''}>${
      c && c.html !== undefined ? c.html : esc(String(c && c.v !== undefined ? c.v : c))
    }</td>`).join('')
  }</tr>`).join('')}</tbody></table></div>`;
}

const VIEWS = {};
const AFTER = {};
const ACTIONS = {};
ACTIONS.toggleAdvanced = () => {
  state.advancedOpen = !state.advancedOpen;
  render(state.advancedOpen ? 'Detailed recorded traces are now visible.' : 'Showing the model journey.');
};
ACTIONS.setDepth = value => {
  if (!['see', 'explain', 'derive'].includes(value)) return;
  state.depth = value;
  const saved = persistCourse();
  render(`Reading depth: ${value === 'see' ? 'Summary' : value === 'explain' ? 'Read' : 'Deep dive'}.${saved ? '' : ' Storage unavailable; changes last for this session.'}`);
};
ACTIONS.focusMain = () => $('main').focus();
ACTIONS.markRead = id => {
  if (!BASIC_PAGES.some(p => p[0] === id && id !== 'start')) return;
  state.completed = state.completed.includes(id) ? state.completed.filter(x => x !== id) : [...state.completed, id];
  const saved = persistCourse();
  render(`Reading progress updated. This is not a mastery score.${saved ? '' : ' Storage unavailable; changes last for this session.'}`);
};
ACTIONS.bookmark = () => {
  const sections = [...$('main').querySelectorAll('.book-section')];
  const top = Math.max(document.querySelector('.topbar').getBoundingClientRect().bottom + 28,
    sections.length ? parseFloat(getComputedStyle(sections[0]).scrollMarginTop) + 2 : 0);
  const passed = sections.filter(s => s.getBoundingClientRect().top <= top);
  const section = passed[passed.length - 1];
  state.bookmark = state.page + (section ? '/' + section.id : '');
  const saved = persistCourse();
  $('resume-course').disabled = false;
  $('bookmark-course').textContent = saved ? 'Bookmarked' : 'Saved for session';
  announce(saved ? 'Reading place bookmarked in this browser.' : 'Bookmarked for this session. Browser storage is unavailable.');
};
ACTIONS.resume = () => { if (state.bookmark) goto(state.bookmark); };
ACTIONS.printBook = () => window.print();
/* ------------------------------------------------------------------ *
 * Predict before you look.
 *
 * The product's stated unit of learning is one prediction, one
 * intervention, one inspectable result. A quiz whose two branches print
 * the same paragraph is not that: it cannot tell a learner apart from
 * someone who guessed. Each probe below targets one named misconception,
 * gives DIFFERENT remediation per wrong answer, and reveals the real
 * recorded number afterwards so the answer is checkable rather than
 * asserted.
 * ------------------------------------------------------------------ */

const PROBES = [
  {
    id: 'weights-vs-activations', page: 'forward',
    misconception: 'weight versus activation',
    question: 'You run this prompt through the model twice without training. What changes the second time?',
    options: [
      { label: 'The learned weights adapt to the prompt', correct: false,
        why: 'Nothing in a forward pass writes to a parameter. Reading a prompt cannot teach the model anything — that needs a separate backward pass and an optimiser step.' },
      { label: 'Nothing at all changes', correct: false,
        why: 'Close, but the activations are recomputed from scratch each time, and with a KV cache there is inference state too. What persists unchanged is the weights.' },
      { label: 'The activations are recomputed; the weights are identical', correct: true,
        why: 'Activations depend on the input and are rebuilt every pass. Weights only move when something steps the optimiser.' },
    ],
    evidence: () => {
      const c = DATA.checks.results.find(r => r.name === 'inference_does_not_change_weights');
      return c ? `Measured: generating twice left the weight hash at <code>${esc(c.measured.weight_hash_after)}</code>, unchanged from <code>${esc(c.measured.weight_hash_before)}</code>.` : '';
    },
  },
  {
    id: 'token-vs-channel', page: 'forward',
    misconception: 'token versus channel',
    question: `This tensor is [batch, token, channel]. What does one ROW hold?`,
    options: [
      { label: 'One channel’s value at every token', correct: false,
        why: 'That is a COLUMN. Rows and columns here mean different things: moving down a column follows one channel across positions.' },
      { label: 'All channels for one token position', correct: true,
        why: 'A row is one position’s whole representation. Its coordinates are learned channels, not words and not named features.' },
      { label: 'One word of the sentence', correct: false,
        why: 'A row corresponds to one TOKEN, and this tokenizer uses one character per token — so a row is a character, not a word.' },
    ],
    evidence: () => `This slice is <code>${esc(ckpt().tensors[operations()[state.op]].axes.join(' × '))}</code> with shape <code>${ckpt().tensors[operations()[state.op]].shape.join(' × ')}</code>.`,
  },
  {
    id: 'gradient-sign', page: 'update',
    misconception: 'gradient direction versus update direction',
    question: 'A weight has a POSITIVE gradient. Plain SGD will move that weight which way?',
    options: [
      { label: 'Up — follow the gradient', correct: false,
        why: 'The gradient points the way the LOSS increases. Following it would make the model worse; that is gradient ascent.' },
      { label: 'Down — against the gradient', correct: true,
        why: 'The update is −learning_rate × gradient, so a positive gradient produces a negative change.' },
      { label: 'It depends on the learning rate’s sign', correct: false,
        why: 'The learning rate is a positive step size. It scales the step; the minus sign in the update rule sets the direction.' },
    ],
    evidence: () => {
      const g = ckpt().gradient_step;
      if (!g.gradient) return 'On this checkpoint the displayed matrix is frozen, so it has no gradient at all.';
      const r = g.row, c = g.column;
      return `Measured at cell [${r}, ${c}]: gradient <code>${fmt(g.gradient[r][c], 6)}</code>, change <code>${fmt(g.delta[r][c], 6)}</code> — opposite signs.`;
    },
  },
  {
    id: 'loss-vs-reward', page: 'rlvr',
    misconception: 'loss versus reward',
    question: 'The verifier reward goes up across GRPO iterations. What has been demonstrated?',
    options: [
      { label: 'The model got better at arithmetic', correct: false,
        why: 'Only if the verifier measures arithmetic correctly. Swap in the broken substring checker and the reward rises while nothing improves.' },
      { label: 'The policy scores higher under THAT verifier', correct: true,
        why: 'Reward is whatever the verifier returns. Whether it tracks the task is a separate question you have to check independently.' },
      { label: 'The loss went down', correct: false,
        why: 'Reward is not a loss. It is a scalar training signal that is maximised, it is not differentiated through, and it has no calibrated scale.' },
    ],
    evidence: () => {
      const h = DATA.stages.grpo.history;
      return `This run: mean reward ${fmt(h[0].mean_reward, 3)} → ${fmt(h[h.length - 1].mean_reward, 3)}, and held-out pass@1 on the <code>compose</code> family stayed at ${pct(DATA.stages.evaluation.reports.find(r => r.checkpoint === 'rl').task_pass_1.compose)}.`;
    },
  },
  {
    id: 'lora-rank', page: 'lora',
    misconception: 'LoRA rank versus head count',
    question: () => `This adapter uses rank r = ${DATA.stages.lora_sft.lora.config.rank}. What does that number constrain?`,
    options: [
      { label: 'How many attention heads are adapted', correct: false,
        why: 'Rank has nothing to do with heads. Which matrices are adapted is the target list; rank constrains the SHAPE of each update.' },
      { label: 'The number of non-zero singular values in each weight update', correct: true,
        why: 'ΔW = (α/r)·B·A is a full-size matrix with at most r independent directions. That is the whole constraint.' },
      { label: 'How much the model’s behaviour can change', correct: false,
        why: 'A low-rank update can still change behaviour a great deal — and it can still cause forgetting. Rank bounds the form, not the magnitude.' },
    ],
    evidence: () => {
      const a = (DATA.stages.lora_sft.adapters || [])[0];
      if (!a) return '';
      return `Measured on <code>${esc(a.module)}</code>: the update is ${a.delta_shape.join('×')} with realised rank ${a.delta_matrix_rank}, and its singular values are [${a.delta_singular_values.map(v => Number(v).toExponential(1)).join(', ')}].`;
    },
  },
  {
    id: 'reference-vs-reward-model', page: 'preference',
    misconception: 'reward model versus reference policy',
    question: 'In DPO, what is the frozen reference model for?',
    options: [
      { label: 'It scores responses, like a reward model', correct: false,
        why: 'It produces log-probabilities, not scores. DPO has no trained reward model at all — that is the point of the method.' },
      { label: 'It is the baseline each log-probability is measured against', correct: true,
        why: 'The objective compares how much MORE likely the policy makes the chosen answer relative to the reference, and the same for rejected.' },
      { label: 'It generates fresh completions each step', correct: false,
        why: 'Standard offline DPO samples nothing during the update. It reads fixed pairs. Generating new preference data is a separate stage.' },
    ],
    evidence: () => {
      const c = DATA.checks.results.find(r => r.name === 'dpo_starts_at_ln2_with_zero_margin');
      return c ? `Measured: with policy equal to reference the margin is ${Number(c.measured.max_absolute_margin).toExponential(1)} and the loss is ${Number(c.measured.loss).toFixed(6)} = ln 2.` : '';
    },
  },
  {
    id: 'memorise-vs-generalise', page: 'sft',
    misconception: 'a trained answer versus instruction following',
    question: 'The model answers a trained question correctly. What follows?',
    options: [
      { label: 'It can follow instructions', correct: false,
        why: 'A correct answer to a trained prompt is consistent with memorisation, but does not distinguish it from generalisation. Check the paraphrase and held-out families.' },
      { label: 'It answered a familiar prompt; generalisation is untested by it', correct: true,
        why: 'Exactly. Separate families exist so this distinction cannot be papered over by one average.' },
      { label: 'It understands the question', correct: false,
        why: 'Understanding is not what was measured. What was measured is an exact string match on a prompt that appeared in training.' },
    ],
    evidence: () => {
      const r = DATA.stages.evaluation.reports.find(x => x.checkpoint === 'sft');
      return `Measured at the SFT checkpoint: trained ${pct(r.instruction_exact_match.train)}, paraphrased ${pct(r.instruction_exact_match.paraphrase)}, held-out facts ${pct(r.instruction_exact_match.heldout)}.`;
    },
  },
  {
    id: 'cache-vs-memory', page: 'generate',
    misconception: 'inference context versus permanent learning',
    question: 'The KV cache grows as the model generates. What is it?',
    options: [
      { label: 'A memory of past conversations', correct: false,
        why: 'It lives for one generation and is then discarded. Nothing about it survives to the next call or to the weights.' },
      { label: 'Saved keys and values, so the prefix is not recomputed', correct: true,
        why: 'It is pure work-avoidance. Identical tokens come out with or without it.' },
      { label: 'A set of weights learned during generation', correct: false,
        why: 'Generation runs no optimiser. The cache is activation state; weights only move during training.' },
    ],
    evidence: () => {
      const c = DATA.checks.results.find(r => r.name === 'kv_cache_equivalence');
      return c ? `Measured: cached and uncached decoding produced the same tokens (${c.measured.same_tokens}), differing by ${Number(c.measured.relative_difference).toExponential(1)} relative to the logit scale — float32 round-off.` : '';
    },
  },
];

const PROBE_KEY = 'glassbox.probes.v1';

function loadProbes() {
  try {
    return JSON.parse(localStorage.getItem(PROBE_KEY) || '{}') || {};
  } catch (e) {
    /* Private windows and blocked site data both throw here. A learner must
     * still be able to use the page, so an unreadable store is an empty one. */
    return {};
  }
}
function saveProbes(v) {
  try { localStorage.setItem(PROBE_KEY, JSON.stringify(v)); } catch (e) { /* not essential */ }
}
let probeState = loadProbes();

ACTIONS.answerProbe = arg => {
  const [id, idx] = arg.split('|');
  probeState[id] = Number(idx);
  saveProbes(probeState);
  const probe = PROBES.find(p => p.id === id);
  const opt = probe.options[Number(idx)];
  render(opt.correct ? 'Correct. ' + probe.question : 'Not quite. Read the explanation below.');
};
ACTIONS.resetProbe = id => {
  delete probeState[id];
  saveProbes(probeState);
  render('Prediction cleared.');
};

function probeBlock(page) {
  const mine = PROBES.filter(p => p.page === page);
  if (!mine.length) return '';
  return mine.map(p => {
    const answered = probeState[p.id];
    const done = answered !== undefined;
    const opt = done ? p.options[answered] : null;
    const correctIdx = p.options.findIndex(o => o.correct);
    const question = typeof p.question === 'function' ? p.question() : p.question;
    return `<section class="card" style="margin-top:18px">
      <div class="card-header">
        <div><div class="eyebrow">Predict before you look</div>
        <h2>${esc(question)}</h2></div>
        <span class="badge ${done ? (opt.correct ? 'good' : 'amber') : 'gray'}">${
          done ? (opt.correct ? 'correct' : 'try again') : 'unanswered'}</span>
      </div>
      <p class="small muted">Probing a common confusion: <strong>${esc(p.misconception)}</strong>.
      Commit to an answer first — the evidence is shown afterwards either way.</p>
      <div class="step-controls">${p.options.map((o, i) => `
        <button class="${done && i === answered ? 'active' : ''}"
          data-act="answerProbe" data-arg="${p.id}|${i}" data-focus="probe-${p.id}-${i}"
          ${done ? 'aria-pressed="' + (i === answered) + '"' : ''}>${esc(o.label)}</button>`).join('')}
      </div>
      ${done ? `<div class="callout ${opt.correct ? '' : 'amber'}">
        <strong>${opt.correct ? 'That is right.' : 'Not this one.'}</strong> ${esc(opt.why)}
        ${!opt.correct ? `<br><br><strong>The answer is:</strong> ${esc(p.options[correctIdx].label)}.
          ${esc(p.options[correctIdx].why)}` : ''}
        <br><br>${p.evidence ? p.evidence() : ''}
      </div>
      <p><button data-act="resetProbe" data-arg="${p.id}">Clear my answer</button></p>` : ''}
    </section>`;
  }).join('');
}

/* The one reconstruction the whole product rests on: a displayed number
 * rebuilt from its operands. It is verified against the recorded value
 * and reports its own error rather than asserting agreement. */
function dotProductExplanation(id, grid, row, col) {
  const c = ckpt();
  if (id !== 'block0.mlp_up') return null;
  const x = c.tensors['block0.norm_mlp'].values[0][row];
  const W = c.weights.mlp_up;      // [mlp_channel, channel] - PyTorch's layout
  const b = c.weights.mlp_up_bias;
  if (!W || !W[col]) return null;
  let sum = b[col];
  const terms = x.map((v, i) => {
    sum += v * W[col][i];
    return `(${fmt(v, 3)} × ${fmt(W[col][i], 3)})`;
  });
  const recorded = grid[row][col];
  const err = Math.abs(sum - recorded);
  const ok = err < 1e-4;
  return `<strong>One output cell is one dot product plus a bias.</strong><br>
    <code>${terms.join(' + ')} + ${fmt(b[col], 3)}</code><br>
    <code>= ${fmt(sum, 6)}</code> &nbsp; recorded: <code>${fmt(recorded, 6)}</code>
    <span class="badge ${ok ? 'good' : 'bad'}">${ok ? 'matches' : 'MISMATCH'} · error ${err.toExponential(1)}</span>
    <br><br>Hidden channel ${col} uses row ${col} of the stored weight matrix, which is
    <code>[${DATA.manifest.model.mlp_width}, ${DATA.manifest.model.width}]</code> - one row per hidden
    channel. The same weights are reused at every token position; nothing is generated per token.`;
}

/* -- 04 update ----------------------------------------------------- */
ACTIONS.pickWeight = arg => {
  const [i, j] = arg.split(',').map(Number);
  state.wRow = i; state.wCol = j; render();
};
ACTIONS.weightView = v => { state.weightView = v; render(); };

VIEWS.update = () => {
  const g = ckpt().gradient_step;
  const fd = g.finite_difference;
  const frozen = !g.matrix_is_trainable;
  const views = frozen
    ? [['before', 'Weights (frozen)'], ['after', 'After (unchanged)']]
    : [['before', '1 · Before'], ['gradient', '2 · Gradient'], ['delta', '3 · Change'], ['after', '4 · After']];
  if (frozen && (state.weightView === 'gradient' || state.weightView === 'delta')) state.weightView = 'before';
  const grid = g[state.weightView];
  if (state.wRow === null || !grid[state.wRow] || grid[state.wRow][state.wCol] === undefined) {
    state.wRow = Math.min(g.row, grid.length - 1);
    state.wCol = Math.min(g.column, grid[0].length - 1);
  }
  const r = state.wRow, c = state.wCol;
  const fdOk = fd.relative_error < 1e-4;

  return head('REAL BACKPROPAGATION · RECORDED REPLAY', 'A mistake becomes a small weight change.',
    'The gradient says how the loss changes locally with one weight. Plain SGD steps in the opposite direction.') +
  `<div class="grid two">
    <section class="card">
      <div class="eyebrow">${esc(g.matrix)} · checkpoint ${esc(state.checkpoint)}</div>
      <h2>Choose a weight. Follow the update.</h2>
      ${frozen ? `<div class="callout amber"><strong>This matrix is frozen on this checkpoint.</strong>
        ${esc(g.frozen_note)}<br><br>There is no gradient view because there is no gradient:
        <code>requires_grad</code> is <code>False</code>. Switch to the
        <button data-goto="lora">adapters page</button> to see which matrices do move.</div>` : ''}
      <div class="toolbar"><div class="step-controls">${views.map(([id, label]) =>
        `<button class="${state.weightView === id ? 'active' : ''}" data-act="weightView" data-arg="${id}"
          data-focus="wv-${id}">${esc(label)}</button>`).join('')}</div></div>
      <p class="small muted">Rows are the ${grid.length} output (hidden) channels; columns are the
      ${grid[0].length} input channels. This is a shared parameter matrix — it has no token axis.</p>
      ${matrix(grid, { mode: 'weight', selRow: r, selCol: c, act: 'pickWeight' })}
      <div class="callout">
        ${g.all_parameters_updated
          ? `All <strong>${g.updated_parameter_elements.toLocaleString()}</strong> of
             ${g.total_parameter_elements.toLocaleString()} parameters were stepped in this recorded
             update, across ${g.updated_parameter_tensors} tensors. This view shows one of them.`
          : `<strong>${g.updated_parameter_elements.toLocaleString()}</strong> parameters were stepped;
             <strong>${g.frozen_parameter_elements.toLocaleString()}</strong> are frozen and did not move.`}
        Changing one highlighted cell alone would not reproduce the displayed loss change.
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">Selected weight · [${r}, ${c}]</div>

/* -- 05 mlp (live micro-lab) --------------------------------------- */
const W_UP = [[1, 0, 1, -1, .5], [0, 1, 1, 1, -.5], [1, -1, 0, .5, 1]];
const W_DOWN = [[.2, 0, -.1], [0, .3, .1], [.1, -.1, .2], [-.2, .1, 0], [.1, .1, -.2]];
const vmul = (x, w) => w[0].map((_, j) => x.reduce((a, v, i) => a + v * w[i][j], 0));
function activate(v) {
  if (state.activation === 'relu') return Math.max(0, v);
  if (state.activation === 'identity') return v;
  return .5 * v * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (v + .044715 * v ** 3)));
}
const vecRow = x => `<div class="vector">${x.map(v => `<span>${fmt(v, 2)}</span>`).join('')}</div>`;

ACTIONS.setMlp = (v, el) => { state.mlp[Number(el.dataset.arg)] = Number(v); render(); };
ACTIONS.setActivation = v => { state.activation = v; render(); };

VIEWS.mlp = () => {
  const x = state.mlp;
  const z = vmul(x, W_UP), a = z.map(activate), u = vmul(a, W_DOWN);
  const y = x.map((v, i) => v + u[i]);
  return head('LIVE MICRO-LAB · HAND-CHOSEN NUMBERS', 'Three numbers in. Five features. Three back.',
    'Move one input coordinate and watch it contribute to several hidden coordinates, then see the resulting update added to the original vector.', 'amber') +
  `<div class="grid two">
    <section class="card">
      <h2>One token through a tiny MLP.</h2>
      <p class="small muted">This is a separate hand-built 3 → 5 → 3 network computed live in your
      browser. It is <strong>not</strong> the trained model's ${manifest().model.width} →
      ${manifest().model.mlp_width} → ${manifest().model.width} MLP, which lives on the
      <button data-goto="forward">tensor page</button>.</p>
      <div class="grid halves">
        <div>
          <div class="eyebrow">input x [3]</div>${vecRow(x)}
          <hr class="divider"><div class="eyebrow">up-projection z = x · W_up</div>${vecRow(z)}
          <hr class="divider"><div class="eyebrow">after activation f(z)</div>${vecRow(a)}
        </div>
        <div>
          <div class="eyebrow">down-projection update</div>${vecRow(u)}
          <hr class="divider"><div class="eyebrow">residual result x + update</div>${vecRow(y)}
          <div class="callout">Returning to three coordinates is what makes the addition possible.
          It does not recover the original three values.</div>
        </div>
      </div>
      <div class="inspector"><strong>First hidden coordinate:</strong><br>
        <code>z[0] = ${fmt(x[0], 2)}×1 + ${fmt(x[1], 2)}×0 + ${fmt(x[2], 2)}×1 = ${fmt(z[0], 3)}</code><br><br>
        Each other hidden coordinate uses its own column of weights. The new coordinates are
        calculated from all three inputs, not copied and not randomly invented per token.</div>
      <details><summary>The exact hand-chosen matrices</summary><pre>W_up [3,5]
${W_UP.map(r => r.map(v => String(v).padStart(5)).join(' ')).join('\n')}

W_down [5,3]
${W_DOWN.map(r => r.map(v => String(v).padStart(5)).join(' ')).join('\n')}

No bias and no normalisation in this isolated example.</pre></details>
    </section>

    <section class="card">
      <h2>Change just one thing.</h2>
      ${x.map((v, i) => `<div class="slider-row"><label for="x${i}">x[${i}]</label>
        <input id="x${i}" type="range" min="-4" max="4" step="0.5" value="${v}"
          data-act="setMlp" data-arg="${i}" data-focus="x${i}">
        <output>${v}</output></div>`).join('')}
      <label class="small" for="activation">Activation function</label>
      <select id="activation" style="width:100%;margin:6px 0 14px" data-act="setActivation" data-focus="activation">
        ${[['gelu', 'GELU · tanh approximation'], ['relu', 'ReLU · max(0, x)'], ['identity', 'Identity · no nonlinearity']]
          .map(([v, l]) => `<option value="${v}" ${state.activation === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <canvas id="activation-curve" width="460" height="250" role="img"
        aria-label="Curve of the selected activation function"></canvas>
      <div class="callout ${state.activation === 'identity' ? 'amber' : ''}">
        ${state.activation === 'identity'
          ? 'With no nonlinearity the two projections collapse into one linear map: (x·W_up)·W_down = x·(W_up·W_down). The extra width buys nothing.'
          : 'The activation changes the transformation nonlinearly. ReLU zeroes negatives; GELU gates them smoothly. They are not interchangeable.'}
      </div>
      <div class="callout">Does the down-projection undo the up-projection? Compare
      <code>x = [${x.map(v => fmt(v, 1)).join(', ')}]</code> with
      <code>x + update = [${y.map(v => fmt(v, 2)).join(', ')}]</code> above. The width matches; the
      values do not.</div>
    </section>
  </div>`;
};

AFTER.mlp = () => {
  const c = $('activation-curve');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  const X = v => 32 + (v + 5) / 10 * (w - 52);
  const Y = v => h - 26 - (v + 2) / 7 * (h - 46);
  ctx.strokeStyle = '#d3dde4'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(X(-5), Y(0)); ctx.lineTo(X(5), Y(0));
  ctx.moveTo(X(0), Y(-2)); ctx.lineTo(X(0), Y(5));
  ctx.stroke();
  ctx.strokeStyle = '#0a5f56'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const xv = -5 + i / 20, yv = activate(xv);
    i ? ctx.lineTo(X(xv), Y(yv)) : ctx.moveTo(X(xv), Y(yv));
  }
  ctx.stroke();
  /* Mark where the learner's own inputs land on the curve. */
  ctx.fillStyle = '#a6541c';
  vmul(state.mlp, W_UP).forEach(zv => {
    ctx.beginPath(); ctx.arc(X(zv), Y(activate(zv)), 4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#56646f'; ctx.font = '12px system-ui';
  ctx.fillText('input', w - 42, Y(0) - 8);
  ctx.fillText('output', X(0) + 8, 16);
  [-4, -2, 2, 4].forEach(n => ctx.fillText(String(n), X(n) - 4, Y(0) + 16));
};

/* -- 06 pretrain --------------------------------------------------- */
VIEWS.pretrain = () => {
  const p = DATA.stages.pretrain;
  const b = DATA.stages.evaluation.baselines;
  const h = p.history, last = h[h.length - 1];
  const best = p.best_validation;
  const gap = last.validation - last.train;
  const overfitting = last.step > best.step;
  return head('REAL PRETRAINING · RECORDED REPLAY', 'Optimising, memorising, generalising.',
    'Three different things that a falling training loss can mean. The only way to tell them apart is a held-out split and a baseline.') +
  `<div class="grid two">
    <section class="card">
      <h2>Loss over ${p.config.steps.toLocaleString()} optimizer steps</h2>
      <p class="small muted">${esc(p.config.optimizer)} · ${esc(p.config.schedule)} ·
      batch ${p.config.batch_size} · gradient clip ${p.config.grad_clip} ·
      ${p.num_train_windows.toLocaleString()} training windows from ${p.train_documents.length} documents</p>
      ${chart(h, [
        { key: 'train', label: 'training windows' },
        { key: 'validation', label: 'held-out paragraphs' },
      ], {
        refs: [
          { value: b.validation.uniform, label: 'uniform', color: '#93a3b0' },
          { value: b.validation.unigram_laplace, label: 'unigram', color: '#8c7bb8' },
          { value: b.validation.bigram_laplace, label: 'bigram', color: '#a6541c' },
        ],
      })}
      ${statRow([
        [fmt(h[0].train, 3), 'start (= ln V)', 'An untrained model is exactly as surprised as a uniform guess'],
        [fmt(last.train, 3), 'final train'],
        [fmt(last.validation, 3), 'final held-out'],
        [fmt(gap, 3), 'generalisation gap'],
      ])}
      <div class="callout ${overfitting ? 'amber' : ''}">
        Best held-out loss was <strong>${fmt(best.validation, 4)}</strong> at step
        <strong>${best.step.toLocaleString()}</strong>, while training continued to step
        ${last.step.toLocaleString()}.
        ${overfitting
          ? ' After that point the training loss kept falling while the held-out loss rose: the model was still optimising and had stopped generalising. Keeping the final checkpoint rather than the best one is a real and common mistake.'
          : ' Held-out loss was still improving at the end, so this run is not yet overfitting.'}
      </div>
    </section>

    <section class="card">
      <h2>Is it better than counting?</h2>
      <p class="small muted">Every baseline is fitted on the training split only and scored on exactly
      the positions the model is scored on — ${b.validation.scored_positions.toLocaleString()}
      held-out predictions.</p>
      ${table(['model', 'train', 'held out'], [
        ['uniform (ln V)', { v: fmt(b.train.uniform, 4) }, { v: fmt(b.validation.uniform, 4) }],
        ['unigram + Laplace', { v: fmt(b.train.unigram_laplace, 4) }, { v: fmt(b.validation.unigram_laplace, 4) }],
        ['bigram + Laplace', { v: fmt(b.train.bigram_laplace, 4) }, { v: fmt(b.validation.bigram_laplace, 4) }],
        ['this transformer', { html: '<strong>' + fmt(last.train, 4) + '</strong>' },
          { html: '<strong>' + fmt(last.validation, 4) + '</strong>' }],
      ])}
      <div class="callout">${esc(b.note)}</div>
      <hr class="divider">
      <h3>Why a window never crosses a paragraph</h3>
      <p class="small muted">Documents are split BEFORE windowing. If the paragraphs were joined and a
      window slid across the seam, the model would be trained to predict the first character of one
      paragraph from the last character of another — a pattern that exists only in the
      concatenation, not in the data.</p>
      <pre>train documents      ${p.train_documents.join(', ')}
validation documents ${p.validation_documents.join(', ')}
windows              ${p.num_train_windows} train / ${p.num_validation_windows} validation</pre>
      <button data-goto="generate">Now make some text →</button>
    </section>
  </div>`;
};

/* -- 07 generate --------------------------------------------------- */
ACTIONS.pickSample = v => { state.genSample = Number(v); render(); };

VIEWS.generate = () => {
  const c = ckpt();
  const keys = Object.keys(c.samples);
  state.genSample = Math.min(state.genSample, keys.length - 1);
  const key = keys[state.genSample];
  const s = c.samples[key];
  const cacheCheck = DATA.checks.results.find(r => r.name === 'kv_cache_equivalence');
  const tempCheck = DATA.checks.results.find(r => r.name === 'temperature_changes_the_distribution');
  const topkCheck = DATA.checks.results.find(r => r.name === 'top_k_restricts_candidates');

  return head('REAL DECODING · RECORDED REPLAY', 'One token at a time, and then it stops.',
    'Generation runs the same weights repeatedly. Nothing is learned while text is produced - the activations and the cache change, the parameters do not.') +
  `<div class="grid two">
    <section class="card">
      <div class="card-header">
        <div><div class="eyebrow">Checkpoint ${esc(state.checkpoint)} · ${esc(s.protocol)}</div>
        <h2>Unedited output</h2></div>
        <label class="small">Prompt <select data-act="pickSample" aria-label="Prompt" data-focus="sample-select">
          ${keys.map((k, i) => `<option value="${i}" ${i === state.genSample ? 'selected' : ''}>${esc(k.replace(/\n/g, '↵'))}</option>`).join('')}
        </select></label>
      </div>
      <pre>${esc(key)}<strong>${esc(s.text)}</strong></pre>
      ${statRow([
        [s.new_ids.length, 'tokens generated'],
        [s.stopped_on_eos ? 'yes' : 'no', 'stopped at EOS'],
        [s.hit_length_limit ? 'yes' : 'no', 'hit length cap'],
      ])}
      <div class="callout ${s.stopped_on_eos ? '' : 'amber'}">
        ${s.stopped_on_eos
          ? 'The model emitted the end-of-sequence token and decoding stopped there. It learned to stop because EOS is a supervised target during instruction tuning.'
          : 'Decoding ended because it reached the length cap, not because the model chose to stop. A model that is never trained to emit EOS can only be cut off.'}
      </div>
      <hr class="divider">
      <h3>Every decision, in order</h3>
      <p class="small muted">At each step the model produces a distribution over all
      ${DATA.data.vocab.length} tokens; the decoding rule picks one.</p>
      ${table(['step', 'chosen', 'p(chosen)', 'runner-up', 'candidates'],
        s.steps.map((st, i) => [
          i,
          { html: `<code>${esc(st.chosen_token)}</code>` },
          { v: (st.chosen_probability * 100).toFixed(1) + '%' },
          { html: st.top[1] ? `<code>${esc(st.top[1].token)}</code> ${(st.top[1].probability * 100).toFixed(1)}%` : '—' },
          { v: st.candidates_kept },
        ]))}
    </section>

    <aside>
      <section class="card">
        <div class="eyebrow">Controls that actually do something</div>
        <h2>Greedy, temperature, top-k, top-p</h2>
        <p class="small muted">A decoding control has to change the distribution the sample is drawn
        from. Dividing logits by a temperature and then taking <code>argmax</code> changes nothing at
        all, because argmax is invariant to positive scaling — so these are verified behaviourally.</p>
        ${tempCheck ? `<h3>Temperature and entropy</h3>
          ${table(['temperature', 'entropy (nats)'],
            Object.entries(tempCheck.measured.entropy_by_temperature)
              .map(([t, e]) => [t, { v: Number(e).toFixed(4) }]))}
          <p><span class="badge ${tempCheck.passed ? 'good' : 'bad'}">${tempCheck.passed
            ? 'higher temperature → higher entropy' : 'temperature has no effect'}</span></p>` : ''}
        ${topkCheck ? `<h3>top-k narrows the candidates</h3>
          ${table(['k', 'tokens left with p > 0'],
            Object.entries(topkCheck.measured.candidates_kept_by_k).map(([k, n]) => [k, { v: n }]))}
          <p class="small muted">Out of ${topkCheck.measured.vocab_size} in the vocabulary.</p>` : ''}
      </section>
      <section class="card">
        <h3>The KV cache</h3>
        <p class="small muted">Without a cache, every new token re-runs the whole prefix. With one, the
        keys and values already computed are reused and only the new position is processed. This
        changes how much work is repeated, not what is computed.</p>
        ${cacheCheck ? `<pre>same tokens either way : ${cacheCheck.measured.same_tokens}
max logit difference   : ${Number(cacheCheck.measured.max_logit_difference).toExponential(2)}
relative to logit scale: ${Number(cacheCheck.measured.relative_difference).toExponential(2)}
dtype                  : ${esc(cacheCheck.measured.dtype)}</pre>
        <p><span class="badge ${cacheCheck.passed ? 'good' : 'bad'}">${cacheCheck.passed
          ? 'cached and uncached decoding agree' : 'cache changes the output — that is a bug'}</span></p>` : ''}
        <div class="callout">A cache is inference state. It is not a memory of past conversations and
        it is not a learned weight. It is discarded when generation ends.</div>
      </section>
    </aside>
  </div>`;
};

/* -- 08 sft -------------------------------------------------------- */
ACTIONS.evalFamily = v => { state.evalFamily = v; render(); };

/* -- 09 lora ------------------------------------------------------- */
VIEWS.lora = () => {

  const adapters = l.adapters || [];

  const asym = DATA.checks.results.find(r => r.name === 'lora_first_step_gradient_asymmetry');
  const frozenChk = DATA.checks.results.find(r => r.name === 'lora_base_weights_stay_frozen');
  const mergeChk = DATA.checks.results.find(r => r.name === 'lora_merge_equivalence');
  const rankChk = DATA.checks.results.find(r => r.name === 'lora_update_rank_is_bounded_by_r');

  return head('REAL ADAPTER TRAINING · RECORDED REPLAY', 'Freeze the model. Train a small update.',
    'LoRA changes WHICH parameters may move. It is not a different training objective and it is not a different source of supervision.') +
  `<div class="grid two">
    <section class="card">
      <h2>The same SFT data, ${pct(info.trainable_fraction)} of the parameters.</h2>

targets = ${cfg.targets.join(', ')}  →  ${info.attached_to.join(', ')}</pre>
      <div class="callout">Rank constrains the FORM of the update to each matrix. It is not a number of

      <h3>What "low rank" bought</h3>

      <p><span class="badge ${rankChk && rankChk.passed ? 'good' : 'bad'}">realised rank

    </section>

    <section class="card">
      <h2>Learned less. Forgot less.</h2>
      <p class="small muted">Both runs used the same examples, the same objective and the same number of

/* The three verifiers, reimplemented here so this lab is live and
 * labelled as such. The recorded GRPO run below used the Python ones. */
const LIVE_VERIFIERS = {
  strict: (text, answer) => {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (!lines.length) return 0;
    const re = /^\s*answer:\s*(-?\d+)\s*$/i;
    /* Exactly one answer line anywhere, and it must be the last one. Reading
     * only the last line rewards enumerating every candidate. */
    const hits = lines.map(l => l.match(re)).filter(Boolean);
    if (hits.length !== 1) return 0;
    if (!re.test(lines[lines.length - 1])) return 0;
    return Number(hits[0][1]) === answer ? 1 : 0;
  },
  substring_broken: (text, answer) => text.includes(String(answer)) ? 1 : 0,
  process: (text, answer) => {
    if (!LIVE_VERIFIERS.strict(text, answer)) return 0;
    const re = /(\d+)\s*\+\s*(\d+)\s*=\s*(\d+)/g;
    let m;
    while ((m = re.exec(text))) if (+m[1] + +m[2] !== +m[3]) return 0;
    return 1;
  },
};

function advantages(rewards) {
  const n = rewards.length;
  const mean = rewards.reduce((a, b) => a + b, 0) / n;
  const std = Math.sqrt(rewards.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
  return { mean, std, adv: std === 0 ? rewards.map(() => 0) : rewards.map(r => (r - mean) / (std + 1e-8)) };
}

  return head('WHERE THIS RUN SITS', 'One model journey, several branches.',
    'The point is not a fixed ladder from base to RLHF. These are alternative and interleavable stages, and which parameters move is a separate axis from what the objective is.', 'gray') +
  `<div class="grid two">
    <section class="card">
      <h2>The three axes that must not be conflated</h2>
      ${table(['axis', 'in this run'], [
        ['training signal / objective', { v: 'next token, demonstrated answers, pairwise preferences, verifier reward' }],
        ['which parameters move', { v: 'full model, or a frozen base plus rank-' + DATA.stages.lora_sft.lora.config.rank + ' adapters' }],
        ['optimisation algorithm', { v: 'AdamW for differentiable losses; a clipped group-relative policy objective for RL' }],
      ])}
      <div class="callout">LoRA is not a source of supervision. GRPO is not a source of reward. RLVR
      describes where a reward comes from, not how the policy is updated. DPO is a preference objective
      that needs no separately trained reward model.</div>
      <hr class="divider">
      <h2>Checkpoint lineage in this run</h2>
      <p class="lineage">initial
  ↳ base                pretraining on ${DATA.data.paragraphs.length} paragraphs
      ↳ sft             full-model instruction tuning
          ↳ dpo         preference optimisation
          ↳ warm_start  SFT on task answer formatting
              ↳ rl      GRPO against a strict verifier
      ↳ lora            frozen base + adapters, same SFT data</p>
      <p class="small muted"><code>sft</code> and <code>lora</code> are siblings on purpose: same data,
      same objective, different trainable parameters.</p>
    </section>
    <section class="card">
      <h2>What this run computes</h2>
      ${built.map(([t, d, page]) => `<div class="route" style="margin-bottom:10px">
        <h3>${t}</h3><p>${d}</p>
        <button data-goto="${page}">Open →</button></div>`).join('')}
    </section>
  </div>
  <section class="card" style="margin-top:18px">
    <h2>Not implemented here</h2>
    <ul class="small muted">${absent.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
    <div class="callout">These training capabilities are absent from the recorded engine.
    The reading chapters explain several of them through explicitly labelled worked examples
    and hypothetical cases. Those examples are not additional measured checkpoints.</div>
    <hr class="divider">
    <h3>Reproducing this run</h3>
    <pre>python -m glassbox.export        # ~${Math.round(m.elapsed_seconds)}s on CPU, writes runs/ and updates this page
python -m glassbox.checks        # the ${DATA.checks.total} numerical checks</pre>
    <p class="small muted">run ${esc(m.run_id)} · seed ${m.seed} · torch ${esc(m.torch_version)} ·
    python ${esc(m.python_version)} · dataset ${esc(String(m.dataset_sha256 || '').slice(0, 12))}</p>
  </section>`;
};
